<page-header class="bg-rose-70" />

<p>
  Browse the media gallery below.
  You can click any picture to view it in detail.
</p>

<mat-grid-list cols="4" rowHeight="1:1">
  @for (image of images; track image; let i = $index) {
    <mat-grid-tile>
      <mat-grid-tile-header>
        <span matLine>Gallery Image: {{ i+1 }}</span>
      </mat-grid-tile-header>
      <img class="w-full h-full object-cover cursor-pointer"
        [src]="image.src" alt="Gallery Image {{ i+1 }}" />
    </mat-grid-tile>
  }
</mat-grid-list>
