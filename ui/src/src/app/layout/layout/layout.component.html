<loading-bar />
<div class="flex h-screen bg-slate-50">
  <!-- Sidebar -->
  <app-sidebar
    [isMinimized]="isSidebarMinimized()"
    [isHidden]="isSidebarHidden()"
    class="h-screen z-30 transition-all duration-300 ease-in-out top-0 left-0"
    [style.position]="isDesktop() ? 'relative' : 'fixed'"
    [class.-translate-x-full]="isSidebarHidden()"
  ></app-sidebar>

  <!-- Main Container -->
  <div class="flex flex-col flex-1 min-w-0">
    <!-- Header -->
    <app-header
      [isDesktop]="isDesktop()"
      (toggleSidebarEvent)="toggleSidebar()"
      (minimizeSidebarEvent)="minimizeSidebar()"
      class="sticky top-0 z-20 shadow-xs"
    ></app-header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 overflow-auto bg-slate-50">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Footer -->
    <app-footer class="mt-auto"></app-footer>
  </div>

  <!-- Mobile Overlay -->
  @if (!isSidebarHidden() && !isDesktop()) {
    <div
      class="fixed inset-0 z-20 bg-black bg-opacity-50 mobile-overlay"
      (click)="toggleSidebar()"
    ></div>
  }
</div>
